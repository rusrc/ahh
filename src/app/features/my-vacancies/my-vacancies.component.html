<div class="my-vacancies-page">
  <div class="page-header">
    <h1 class="page-title">Мои вакансии</h1>
    <button type="button" class="btn btn-primary" (click)="addVacancy()">Добавить вакансию</button>
  </div>

  <div class="vacancy-grid">
    @for (v of vacancies(); track v.id) {
      <div class="card vacancy-card">
        <h3 class="vacancy-title">{{ v.title }}</h3>
        <p class="vacancy-company">{{ v.company }}</p>
        @if (v.salary) {
          <p class="vacancy-salary">{{ v.salary }}</p>
        }
        <div class="vacancy-tags">
          @for (t of v.tags; track t) {
            <span class="tag tag-sm">{{ t }}</span>
          }
        </div>
      </div>
    }
  </div>
</div>
