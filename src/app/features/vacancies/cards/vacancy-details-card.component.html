<div class="card vacancy-details-card">
  <div class="vacancy-details-header">
    <div>
      <h2 class="vacancy-title">{{ vacancy.title }}</h2>
      <p class="vacancy-company">{{ vacancy.company }}</p>
      @if (vacancy.salary) {
        <p class="vacancy-salary">{{ vacancy.salary }}</p>
      }
    </div>
    @if (showEdit) {
      <a class="vacancy-edit-link" [routerLink]="resolveEditLink()" title="Редактировать вакансию" aria-label="Редактировать вакансию">
        <svg class="vacancy-edit-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path
            d="M13.7 3.3 16.7 6.3 7 16H4v-3l9.7-9.7Zm1.4-1.4a2 2 0 0 1 2.8 0l0.6 0.6a2 2 0 0 1 0 2.8l-1.3 1.3-3.4-3.4 1.3-1.3Z"
            fill="currentColor"
          />
        </svg>
      </a>
    }
  </div>

  <div class="vacancy-section">
    <h4 class="vacancy-section-title">О вакансии</h4>
    <p class="vacancy-description">Описание пока не заполнено. Добавьте детали в режиме редактирования.</p>
  </div>

  <div class="vacancy-section">
    <h4 class="vacancy-section-title">Теги</h4>
    <div class="vacancy-tags">
      @for (t of vacancy.tags; track t) {
        <span class="tag tag-sm">{{ t }}</span>
      }
    </div>
  </div>

  @if (showRespond) {
    <button type="button" class="btn btn-primary" (click)="respond.emit(vacancy)">
      Откликнуться
    </button>
  }
</div>
