<div class="card vacancy-card">
  <div class="vacancy-header">
    <div class="vacancy-title-wrap">
      <a class="vacancy-title-link" [routerLink]="resolveDetailsLink()">
        <h3 class="vacancy-title">{{ vacancy.title }}</h3>
      </a>
      <p class="vacancy-company">{{ vacancy.company }}</p>
      @if (vacancy.salary) {
        <p class="vacancy-salary">{{ vacancy.salary }}</p>
      }
    </div>
    @if (showEdit) {
      <a
        class="vacancy-edit-link"
        [routerLink]="resolveEditLink()"
        title="Редактировать вакансию"
        aria-label="Редактировать вакансию"
      >
        <svg class="vacancy-edit-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path
            d="M13.7 3.3 16.7 6.3 7 16H4v-3l9.7-9.7Zm1.4-1.4a2 2 0 0 1 2.8 0l0.6 0.6a2 2 0 0 1 0 2.8l-1.3 1.3-3.4-3.4 1.3-1.3Z"
            fill="currentColor"
          />
        </svg>
      </a>
    }
  </div>

  @if (getDescriptionPreview()) {
    <p class="vacancy-description">{{ getDescriptionPreview() }}</p>
  }

  <div class="vacancy-tags">
    @for (t of vacancy.tags; track t) {
      @if (tagsInteractive) {
        <button
          type="button"
          class="tag tag-sm"
          [class.active]="isTagSelected(t)"
          (click)="tagToggle.emit(t)"
        >
          {{ t }}
        </button>
      } @else {
        <span class="tag tag-sm">{{ t }}</span>
      }
    }
  </div>

  <div class="vacancy-actions">
    <a class="vacancy-details-link" [routerLink]="resolveDetailsLink()">Подробнее</a>
    @if (showRespond) {
      <button type="button" class="btn btn-primary vacancy-btn" (click)="respond.emit(vacancy)">
        Откликнуться
      </button>
    }
  </div>
</div>
