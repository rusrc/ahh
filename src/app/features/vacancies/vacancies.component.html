<div class="vacancies-page">
  <h1 class="page-title">Вакансии</h1>

  <div class="filter-tags">
    <span class="filter-label">Фильтр:</span>
    @for (tag of allTags(); track tag) {
      <button
        type="button"
        class="tag"
        [class.active]="selectedTag() === tag"
        (click)="selectTag(tag)"
      >
        {{ tag }}
      </button>
    }
  </div>

  <div class="vacancy-grid">
    @for (v of filteredVacancies(); track v.id) {
      <div class="card vacancy-card">
        <h3 class="vacancy-title">{{ v.title }}</h3>
        <p class="vacancy-company">{{ v.company }}</p>
        @if (v.salary) {
          <p class="vacancy-salary">{{ v.salary }}</p>
        }
        <div class="vacancy-tags">
          @for (t of v.tags; track t) {
            <span class="tag tag-sm">{{ t }}</span>
          }
        </div>
        <button type="button" class="btn btn-primary vacancy-btn" (click)="respond(v)">
          Откликнуться
        </button>
      </div>
    }
  </div>
</div>
